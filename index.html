<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuntes del Universo: Las Galaxias</title>
  <style>
    /* Estilos generales con temática espacial */
    body {
      background-color: #0b0d17;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #93c5fd;
      text-align: center;
      border-bottom: 2px dashed #3b82f6;
      padding-bottom: 10px;
    }

    h2 {
      color: #f472b6;
      margin-top: 30px;
    }

    /* Caja de apuntes generales */
    .caja-info {
      background-color: #1e293b;
      border-left: 5px solid #a855f7;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    /* Contenedor interactivo para jugar con CSS */
    .galaxia-interactiva {
      background: radial-gradient(circle, #3b82f6 0%, #1e1b4b 70%, #0b0d17 100%);
      width: 200px;
      height: 200px;
      margin: 20px auto;
      border-radius: 50%;
      box-shadow: 0 0 30px #3b82f6;
      transition: all 0.5s ease;
      cursor: pointer;
    }

    /* Efecto al pasar el mouse por encima */
    .galaxia-interactiva:hover {
      transform: rotate(180deg) scale(1.1);
      box-shadow: 0 0 50px #f472b6;
      background: radial-gradient(circle, #f472b6 0%, #581c87 70%, #0b0d17 100%);
    }

    /* Grid para los tipos de galaxias */
    .tipos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .tarjeta {
      background-color: #111827;
      border: 1px solid #374151;
      padding: 15px;
      border-radius: 8px;
    }

    .tarjeta h3 {
      margin-top: 0;
      color: #34d399;
    }

    code {
      background-color: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fde047;
      font-family: monospace;
    }
  </style>
</head>
<body>
